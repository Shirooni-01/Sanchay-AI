{% extends "base.html" %}

{% block title %}Error {{ status_code }} &mdash; Sanchay AI{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <div class="card error-card">
        <div class="error-code-badge">HTTP {{ status_code }} &middot; {{ error_code }}</div>
        <h1 class="card-title">Request Could Not Be Completed</h1>
        <p class="card-subtitle">{{ error_message }}</p>
        <div class="form-actions">
            <a href="{{ url_for('auth.landing_page') }}" class="btn btn-primary">Return to Home</a>
        </div>
    </div>
</section>
{% endblock %}
