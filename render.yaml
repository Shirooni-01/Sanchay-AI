services:
  - type: web
    name: sanchay-ai
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sanchay-ai-db
          property: connectionString

databases:
  - name: sanchay-ai-db
    plan: free
    databaseName: sanchay_ai_prod
    user: sanchay_admin
